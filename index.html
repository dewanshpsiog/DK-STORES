<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d47725">
  <title>ShopHub - Online Shopping</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <main class="app-shell">
    <div id="siteNavbar"></div>
    <section class="page-container">
      <div class="p-4 p-md-5 mb-4 text-white rounded-3 hero-banner">
        <div class="row align-items-center">
          <div class="col-lg-7">
            <span class="badge bg-light text-primary mb-3">New season collection</span>
            <h1 class="display-5 fw-bold">Everything you need, all in one place.</h1>
            <p class="lead">Discover quality essentials for home, work and everyday life.</p>
            <a class="btn btn-light btn-lg" href="products.html">Shop now <i class="bi bi-arrow-right ms-1"></i></a>
          </div>
        </div>
      </div>
      <div class="d-flex align-items-end justify-content-between mb-3">
        <div><span class="text-primary fw-semibold">Curated for you</span><h2 class="h3 section-heading mb-0">Featured products</h2></div>
        <a class="btn btn-link text-decoration-none" href="products.html">View all <i class="bi bi-arrow-right"></i></a>
      </div>
      <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3" id="featuredProducts"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config/app-config.js"></script>
  <script src="js/config/mock-data.js"></script>
  <script src="js/services/storage-service.js"></script>
  <script src="js/services/api-service.js"></script>
  <script src="js/services/auth-service.js"></script>
  <script src="js/services/category-service.js"></script>
  <script src="js/services/product-service.js"></script>
  <script src="js/services/customer-service.js"></script>
  <script src="js/services/order-service.js"></script>
  <script src="js/services/cart-service.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/product-card.js"></script>
  <script src="js/components/pagination.js"></script>
  <script src="js/components/notification.js"></script>
  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/validators.js"></script>
  <script src="js/utils/date-utils.js"></script>
  <script>
    (async function () {
      await window.ShopApp.storageService.initialize();
      await window.ShopApp.navbar.render("siteNavbar");
      const products = await window.ShopApp.productService.getAllProducts();
      const featured = products.filter((product) => product.isActive).slice(0, 8);
      document.getElementById("featuredProducts").innerHTML = featured.map((product) => window.ShopApp.productCard.render(product)).join("");
      document.getElementById("featuredProducts").addEventListener("click", async (event) => {
        const button = event.target.closest(".add-to-cart");
        if (!button) return;
        try {
          await window.ShopApp.cartService.addItem(button.dataset.productId, 1);
          await window.ShopApp.navbar.render("siteNavbar");
          window.ShopApp.notification.show("Added to cart.", "success");
        } catch (error) {
          window.ShopApp.notification.show(error.message, "danger");
        }
      });
    }());
  </script>
</body>
</html>
