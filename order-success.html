<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order confirmed - ShopHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><div id="siteNavbar"></div><main class="page-container"><div class="surface-card empty-state mx-auto" style="max-width:650px"><i class="bi bi-check-circle-fill text-success display-4"></i><h1 class="h3 mt-3">Order confirmed</h1><p id="orderConfirmation"></p><a class="btn btn-primary" href="order-history.html">View order history</a><a class="btn btn-outline-secondary ms-2" href="products.html">Continue shopping</a></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config/app-config.js"></script><script src="js/config/mock-data.js"></script><script src="js/services/storage-service.js"></script><script src="js/services/api-service.js"></script><script src="js/services/auth-service.js"></script><script src="js/services/category-service.js"></script><script src="js/services/product-service.js"></script><script src="js/services/customer-service.js"></script><script src="js/services/order-service.js"></script><script src="js/services/cart-service.js"></script><script src="js/utils/formatters.js"></script><script src="js/utils/date-utils.js"></script><script src="js/components/navbar.js"></script><script src="js/components/notification.js"></script><script>window.addEventListener("DOMContentLoaded",async function(){await window.ShopApp.storageService.initialize();await window.ShopApp.navbar.render("siteNavbar");const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("orderConfirmation").textContent="Your order has been placed.";return;}const order=await window.ShopApp.orderService.getOrderById(id);document.getElementById("orderConfirmation").innerHTML="Order ID: <strong>"+order.id+"</strong><br>"+window.ShopApp.formatters.currency(order.total)+" via "+order.paymentMethod+"<br>"+window.ShopApp.dateUtils.formatDateTime(order.orderDate);});</script></body></html>
