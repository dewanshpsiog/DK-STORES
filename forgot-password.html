<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password - ShopHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/components.css" rel="stylesheet"></head>
<body><div class="container py-5" style="max-width:460px"><a class="navbar-brand fw-bold d-block text-center mb-4" href="index.html"><img class="brand-mark" src="assets/images/logo.png" alt=""><span>DK Stores</span></a><div class="surface-card p-4"><h1 class="h3">Reset password</h1><p class="text-muted">Request mock password-reset instructions.</p><form id="forgotForm"><label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" type="email" required><div id="forgotMessage"></div><button class="btn btn-primary w-100" type="submit">Send instructions</button></form><a class="d-block text-center mt-3" href="login.html">Back to sign in</a></div></div>
<script src="js/config/app-config.js"></script><script src="js/config/mock-data.js"></script><script src="js/services/storage-service.js"></script><script src="js/services/api-service.js"></script><script src="js/services/auth-service.js"></script><script src="js/services/category-service.js"></script><script src="js/services/product-service.js"></script><script src="js/services/customer-service.js"></script><script src="js/services/order-service.js"></script><script src="js/services/cart-service.js"></script>
<script>(async function(){await window.ShopApp.storageService.initialize();document.getElementById("forgotForm").addEventListener("submit",async function(event){event.preventDefault();try{const result=await window.ShopApp.authService.resetPassword(document.getElementById("email").value);document.getElementById("forgotMessage").innerHTML='<div class="alert alert-success">'+result.message+'</div>';}catch(error){document.getElementById("forgotMessage").innerHTML='<div class="alert alert-danger">'+error.message+'</div>';}});}());</script></body></html>
