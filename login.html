<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in - ShopHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/components.css" rel="stylesheet"></head>
<body><div class="container py-5" style="max-width:460px"><a class="navbar-brand fw-bold d-block text-center mb-4" href="index.html"><i class="bi bi-bag-check-fill text-primary me-2"></i>ShopHub</a><div class="surface-card p-4"><h1 class="h3 mb-1">Welcome back</h1><p class="text-muted mb-4">Sign in to your account.</p><form id="loginForm" novalidate><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><div class="input-group"><input class="form-control" id="password" type="password" required><button class="btn btn-outline-secondary" id="togglePassword" type="button" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div><div id="loginMessage" class="mb-3"></div><button class="btn btn-primary w-100" type="submit">Sign in</button></form><div class="d-flex justify-content-between mt-3"><a href="forgot-password.html">Forgot password?</a><a href="signup.html">Create account</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config/app-config.js"></script><script src="js/config/mock-data.js"></script><script src="js/services/storage-service.js"></script><script src="js/services/api-service.js"></script><script src="js/services/auth-service.js"></script><script src="js/services/category-service.js"></script><script src="js/services/product-service.js"></script><script src="js/services/customer-service.js"></script><script src="js/services/order-service.js"></script><script src="js/services/cart-service.js"></script>
<script src="js/utils/validators.js"></script>
<script>(async function(){await window.ShopApp.storageService.initialize();document.getElementById("togglePassword").addEventListener("click",function(){const input=document.getElementById("password");input.type=input.type==="password"?"text":"password";});document.getElementById("loginForm").addEventListener("submit",async function(event){event.preventEventDefault&&event.preventEventDefault();event.preventDefault();const email=document.getElementById("email").value;const password=document.getElementById("password").value;if(!window.ShopApp.validators.email(email)||!window.ShopApp.validators.password(password)){document.getElementById("loginMessage").innerHTML='<div class="alert alert-danger">Enter a valid email and password.</div>';return;}try{const session=await window.ShopApp.authService.login(email,password);window.location.href=session.role==="ADMIN"?"admin/dashboard.html":"index.html";}catch(error){document.getElementById("loginMessage").innerHTML='<div class="alert alert-danger">'+error.message+'</div>';}});}());</script></body></html>
