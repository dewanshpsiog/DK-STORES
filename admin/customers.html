<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customers - ShopHub Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"></head><body><div class="admin-layout"><div id="adminSidebar"></div><main class="admin-main"><header class="admin-header d-flex align-items-center px-4"><h1 class="h5 mb-0">Customers</h1></header><section class="p-4"><div class="surface-card p-4"><input class="form-control mb-3" id="customerSearch" placeholder="Search by name or email" style="max-width:420px"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Credit limit</th><th>Outstanding</th><th>Available</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="customerRows"></tbody></table></div></div></section></main></div><div class="modal fade" id="creditModal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="creditForm"><div class="modal-header"><h2 class="modal-title h5">Update credit limit</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="creditCustomerId"><label class="form-label" for="creditLimit">Credit limit</label><input class="form-control" id="creditLimit" type="number" min="0" required></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form></div></div>
