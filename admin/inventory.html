<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory - ShopHub Admin</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><link href="../css/components.css" rel="stylesheet"></head><body><div class="admin-layout"><div id="adminSidebar"></div><main class="admin-main"><header class="admin-header d-flex align-items-center justify-content-between px-4"><h1 class="h5 mb-0">Inventory</h1><button class="btn btn-primary btn-sm" id="addProduct" data-bs-toggle="modal" data-bs-target="#productModal"><i class="bi bi-plus-lg me-1"></i>Add product</button></header><section class="p-4"><div class="surface-card p-4"><div class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" id="productSearch" placeholder="Search products"></div><div class="col-md-4"><select class="form-select" id="productCategory"><option value="">All categories</option></select></div></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Stock</th><th>Price</th><th>Status</th><th class="text-end">Actions</th></tr></thead><tbody id="inventoryRows"></tbody></table></div><nav class="mt-3"><ul class="pagination justify-content-center mb-0" id="inventoryPagination"></ul></nav></div></section></main></div><div class="modal fade" id="productModal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="productForm"><div class="modal-header"><h2 class="modal-title h5" id="productModalTitle">Add product</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="productId"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="productTitle">Title</label><input class="form-control" id="productTitle" required></div><div class="col-md-6"><label class="form-label" for="productCategoryField">Category</label><select class="form-select" id="productCategoryField" required></select></div><div class="col-12"><label class="form-label" for="productDescription">Description</label><textarea class="form-control" id="productDescription" rows="3" required></textarea></div><div class="col-md-4"><label class="form-label" for="productQty">Stock</label><input class="form-control" id="productQty" type="number" min="0" required></div><div class="col-md-4"><label class="form-label" for="productPrice">Price</label><input class="form-control" id="productPrice" type="number" min="0" required></div><div class="col-md-4"><label class="form-label" for="productImage">Image URL</label><input class="form-control" id="productImage" placeholder="assets/images/placeholder.svg"></div><div class="col-12"><div class="form-check"><input class="form-check-input" id="productActive" type="checkbox" checked><label class="form-check-label" for="productActive">Active</label></div></div></div></div><div class="modal-footer"><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/config/app-config.js"></script><script src="../js/config/mock-data.js"></script><script src="../js/services/storage-service.js"></script><script src="../js/services/api-service.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/category-service.js"></script><script src="../js/services/product-service.js"></script><script src="../js/services/customer-service.js"></script><script src="../js/services/order-service.js"></script><script src="../js/utils/formatters.js"></script><script src="../js/utils/date-utils.js"></script><script src="../js/components/sidebar.js"></script><script src="../js/components/pagination.js"></script><script src="../js/components/notification.js"></script><script src="../js/admin/inventory.js"></script></body></html>
