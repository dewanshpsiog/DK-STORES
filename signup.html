<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account - ShopHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/components.css" rel="stylesheet"></head>
<body><div class="container py-5" style="max-width:520px"><a class="navbar-brand fw-bold d-block text-center mb-4" href="index.html"><i class="bi bi-bag-check-fill text-primary me-2"></i>ShopHub</a><div class="surface-card p-4"><h1 class="h3">Create account</h1><form id="signupForm" novalidate class="mt-3"><div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" required></div><div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" required></div><div class="mb-3"><label class="form-label" for="mobile">Mobile</label><input class="form-control" id="mobile" inputmode="numeric" maxlength="10" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" minlength="8" required></div><div id="signupMessage" class="mb-3"></div><button class="btn btn-primary w-100" type="submit">Create account</button></form><p class="text-center mt-3 mb-0">Already have an account? <a href="login.html">Sign in</a></p></div></div>
<script src="js/config/app-config.js"></script><script src="js/config/mock-data.js"></script><script src="js/services/storage-service.js"></script><script src="js/services/api-service.js"></script><script src="js/services/auth-service.js"></script><script src="js/services/category-service.js"></script><script src="js/services/product-service.js"></script><script src="js/services/customer-service.js"></script><script src="js/services/order-service.js"></script><script src="js/services/cart-service.js"></script><script src="js/utils/validators.js"></script>
<script>(async function(){await window.ShopApp.storageService.initialize();document.getElementById("signupForm").addEventListener("submit",async function(event){event.preventDefault();const customer={name:document.getElementById("name").value,email:document.getElementById("email").value,mobile:document.getElementById("mobile").value,password:document.getElementById("password").value};const valid=window.ShopApp.validators.required(customer.name)&&window.ShopApp.validators.email(customer.email)&&window.ShopApp.validators.mobile(customer.mobile)&&window.ShopApp.validators.password(customer.password);if(!valid){document.getElementById("signupMessage").innerHTML='<div class="alert alert-danger">Check your name, email, 10-digit mobile number and password.</div>';return;}try{await window.ShopApp.authService.signup(customer);document.getElementById("signupMessage").innerHTML='<div class="alert alert-success">Account created. <a href="login.html">Sign in now</a>.</div>';event.currentTarget.reset();}catch(error){document.getElementById("signupMessage").innerHTML='<div class="alert alert-danger">'+error.message+'</div>';}});}());</script></body></html>
