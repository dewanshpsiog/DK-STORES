<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout - ShopHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"><link href="css/components.css" rel="stylesheet"></head>
<body><div id="siteNavbar"></div><main class="page-container"><h1 class="h2 mb-4">Checkout</h1><div id="checkoutMessage" role="alert"></div><form id="checkoutForm" novalidate><div class="row g-4"><div class="col-lg-8"><div class="surface-card p-4"><h2 class="h5">Delivery details</h2><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label" for="fullName">Full name</label><input class="form-control" id="fullName" required></div><div class="col-md-6"><label class="form-label" for="mobile">Mobile</label><input class="form-control" id="mobile" maxlength="10" inputmode="numeric" required></div><div class="col-12"><label class="form-label" for="address">Address</label><textarea class="form-control" id="address" rows="3" required></textarea></div><div class="col-md-8"><label class="form-label" for="city">City</label><input class="form-control" id="city" required></div><div class="col-md-4"><label class="form-label" for="pinCode">PIN code</label><input class="form-control" id="pinCode" maxlength="6" inputmode="numeric" required></div></div><h2 class="h5 mt-4">Payment method</h2><div class="form-check"><input class="form-check-input" type="radio" name="paymentMethod" id="cashPayment" value="CASH" checked><label class="form-check-label" for="cashPayment">Cash on delivery</label></div><div class="form-check"><input class="form-check-input" type="radio" name="paymentMethod" id="creditPayment" value="CREDIT"><label class="form-check-label" for="creditPayment">Customer credit</label></div><div class="alert alert-light border mt-3">Available credit: <strong id="availableCredit">--</strong></div></div></div><div class="col-lg-4"><div class="surface-card p-4"><h2 class="h5">Order summary</h2><div id="orderItems" class="mt-3"></div><hr><div class="d-flex justify-content-between"><strong>Total</strong><strong class="h5 text-primary" id="checkoutTotal">--</strong></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" id="confirmTerms" required><label class="form-check-label" for="confirmTerms">I confirm the delivery details</label></div><button class="btn btn-primary w-100 mt-3" type="submit">Place order</button></div></div></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/config/app-config.js"></script><script src="js/config/mock-data.js"></script><script src="js/services/storage-service.js"></script><script src="js/services/api-service.js"></script><script src="js/services/auth-service.js"></script><script src="js/services/category-service.js"></script><script src="js/services/product-service.js"></script><script src="js/services/customer-service.js"></script><script src="js/services/order-service.js"></script><script src="js/services/cart-service.js"></script><script src="js/utils/formatters.js"></script><script src="js/utils/validators.js"></script><script src="js/components/navbar.js"></script><script src="js/components/notification.js"></script><script src="js/customer/checkout.js"></script></body></html>
